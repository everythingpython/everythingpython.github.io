<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A 90-minute no-code workshop for building a supplier risk and follow-up assistant with Activepieces.">
  <title>Supplier Risk and Follow-up Assistant · IIM Mumbai Workshop</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #20211e;
      color: #f6f2e8;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 20%, rgba(246, 242, 232, 0.08), transparent 45%),
        #20211e;
    }

    body {
      display: grid;
      place-items: center;
      padding: 18px 18px 76px;
    }

    main {
      position: relative;
      width: min(100%, 1600px);
      height: min(calc(100vh - 94px), calc((100vw - 36px) * 9 / 16));
      min-height: 180px;
      display: grid;
      place-items: center;
    }

    #slide {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #f6f2e8;
      box-shadow: 0 22px 70px rgba(0, 0, 0, 0.42);
      user-select: none;
      -webkit-user-drag: none;
    }

    .slide-link {
      position: absolute;
      display: none;
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
    }

    .slide-link.active { display: block; }

    .slide-link:hover, .slide-link:focus-visible {
      background: rgba(158, 49, 94, 0.08);
      outline: 2px solid #9e315e;
      outline-offset: 2px;
    }

    #website-link { left: 71.02%; top: 46.94%; width: 20.47%; height: 3.89%; }
    #linkedin-link { left: 71.02%; top: 53.47%; width: 20.47%; height: 5.83%; }
    #topmate-link {
      left: 71.02%;
      top: 66%;
      width: 20.47%;
      height: 3.6%;
      color: #9e315e;
      font-size: clamp(8px, 0.82vw, 13px);
      font-weight: 700;
      line-height: 1;
      text-decoration: underline;
    }

    nav {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: min(620px, calc(100vw - 24px));
      padding: 8px 10px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      background: rgba(24, 25, 22, 0.94);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(14px);
      z-index: 5;
    }

    button, a {
      border: 0;
      color: inherit;
      font: inherit;
    }

    button {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #353630;
      cursor: pointer;
    }

    button:hover, button:focus-visible, a:hover, a:focus-visible {
      background: #4a4b44;
      outline: 2px solid #e5f7b8;
      outline-offset: 2px;
    }

    button:disabled { opacity: 0.35; cursor: default; }

    .progress {
      flex: 1 1 auto;
      height: 6px;
      overflow: hidden;
      border-radius: 999px;
      background: #4a4b44;
    }

    .progress span {
      display: block;
      width: 4.7619%;
      height: 100%;
      border-radius: inherit;
      background: #e5f7b8;
      transition: width 180ms ease;
    }

    output {
      min-width: 62px;
      color: #d9d6ce;
      font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      text-align: center;
    }

    nav a {
      padding: 9px 13px;
      border-radius: 999px;
      color: #20211e;
      background: #fbeab0;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .hint {
      position: fixed;
      top: 12px;
      right: 16px;
      color: rgba(246, 242, 232, 0.58);
      font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    @media (max-width: 680px) {
      body { padding: 8px 8px 72px; }
      main { height: min(calc(100vh - 80px), calc((100vw - 16px) * 9 / 16)); }
      nav { min-width: calc(100vw - 16px); gap: 6px; }
      nav a { padding: 9px 10px; font-size: 0; }
      nav a::after { content: "PPTX"; font-size: 12px; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <main aria-live="polite">
    <img id="slide" src="slides/slide-1.png" alt="Slide 1 of 21: Build a supplier risk and follow-up assistant">
    <a id="website-link" class="slide-link" href="https://everythingpython.in" aria-label="Open Everything Python"></a>
    <a id="linkedin-link" class="slide-link" href="https://linkedin.com/in/abhiramr5459" aria-label="Open Abhiram's LinkedIn profile"></a>
    <a id="topmate-link" class="slide-link" href="https://topmate.io/abhiram_r/">https://topmate.io/abhiram_r/</a>
  </main>

  <nav aria-label="Slide navigation">
    <button id="previous" type="button" aria-label="Previous slide">←</button>
    <div class="progress" aria-hidden="true"><span id="progress"></span></div>
    <output id="count" aria-live="polite">01 / 21</output>
    <button id="next" type="button" aria-label="Next slide">→</button>
    <button id="fullscreen" type="button" aria-label="Toggle fullscreen">⛶</button>
    <a href="supplier-risk-follow-up-activepieces-workshop.pptx" download>Download PowerPoint</a>
  </nav>

  <div class="hint">← → navigate · F fullscreen</div>

  <script>
    const total = 21;
    const slide = document.querySelector("#slide");
    const previous = document.querySelector("#previous");
    const next = document.querySelector("#next");
    const fullscreen = document.querySelector("#fullscreen");
    const progress = document.querySelector("#progress");
    const count = document.querySelector("#count");
    const slideLinks = document.querySelectorAll(".slide-link");
    let current = Math.min(total, Math.max(1, Number(location.hash.slice(1)) || 1));
    let pointerStart = null;

    function render() {
      slide.src = `slides/slide-${current}.png`;
      slide.alt = `Slide ${current} of ${total}`;
      previous.disabled = current === 1;
      next.disabled = current === total;
      progress.style.width = `${(current / total) * 100}%`;
      count.value = `${String(current).padStart(2, "0")} / ${total}`;
      slideLinks.forEach((link) => link.classList.toggle("active", current === total));
      history.replaceState(null, "", `#${current}`);
      [current - 1, current + 1].filter((n) => n >= 1 && n <= total).forEach((n) => {
        const image = new Image();
        image.src = `slides/slide-${n}.png`;
      });
    }

    function move(delta) {
      current = Math.min(total, Math.max(1, current + delta));
      render();
    }

    previous.addEventListener("click", () => move(-1));
    next.addEventListener("click", () => move(1));
    fullscreen.addEventListener("click", () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    });

    document.addEventListener("keydown", (event) => {
      if (["ArrowRight", "PageDown", " "].includes(event.key)) {
        event.preventDefault();
        move(1);
      }
      if (["ArrowLeft", "PageUp"].includes(event.key)) {
        event.preventDefault();
        move(-1);
      }
      if (event.key.toLowerCase() === "f") fullscreen.click();
      if (event.key === "Home") { current = 1; render(); }
      if (event.key === "End") { current = total; render(); }
    });

    slide.addEventListener("pointerdown", (event) => { pointerStart = event.clientX; });
    slide.addEventListener("pointerup", (event) => {
      if (pointerStart === null) return;
      const distance = event.clientX - pointerStart;
      pointerStart = null;
      if (Math.abs(distance) > 60) move(distance < 0 ? 1 : -1);
    });

    window.addEventListener("hashchange", () => {
      const requested = Number(location.hash.slice(1));
      if (Number.isInteger(requested) && requested >= 1 && requested <= total) {
        current = requested;
        render();
      }
    });

    render();
  </script>
</body>
</html>
