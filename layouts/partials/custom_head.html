<!-- Light mode override for blog articles + Tufte CSS -->
<style>
  /* Override root variables to force light mode */
  :root {
    --background-color: #fff;
    --heading-color: #222;
    --text-color: #444;
    --link-color: #3273dc;
    --visited-color: #8b6fcb;
    --blockquote-color: #222;
  }

  /* Ensure light mode applies to article content */
  body {
    background-color: #fff !important;
    color: #444 !important;
  }

  main {
    background-color: #fff !important;
    color: #444 !important;
  }

  h1, h2, h3, h4, h5, h6 {
    color: #222 !important;
  }

  a {
    color: #3273dc !important;
  }

  a:visited {
    color: #8b6fcb !important;
  }

  blockquote {
    color: #222 !important;
    border-left-color: #999 !important;
  }

  code {
    background-color: #f5f5f5 !important;
    color: #222 !important;
  }

  /* Improve blog listing page spacing */
  ul.blog-posts li {
    padding: 0.75rem 0;
    border-bottom: 1px solid #e0e0e0;
    align-items: baseline;
    gap: 1rem;
  }

  ul.blog-posts li:last-child {
    border-bottom: none;
  }

  ul.blog-posts li span {
    flex: 0 0 100px;
    color: #888;
    font-size: 0.9em;
  }

  ul.blog-posts li a {
    flex: 1;
    word-break: break-word;
  }

  /* Add spacing between year sections */
  main content > div > div {
    margin-bottom: 2rem;
  }

  main content > div > div > h2 {
    margin-top: 1.5rem;
    margin-bottom: 0.75rem;
  }

  main content > div > div > small {
    display: block;
    color: #999;
    margin-bottom: 1rem;
  }
</style>

{{ $tufte := resources.Get "css/tufte.css" }}
{{ if $tufte }}
  {{ $styles := $tufte | minify }}
  <style>{{ $styles.Content | safeCSS }}</style>
{{ end }}
